# Pages CMS configuration (https://pagescms.org). Band members sign in with GitHub
# and edit these collections through a form; every save is a commit that redeploys the site.
media:
  input: public/images
  output: /images

content:
  - name: shows
    label: Shows
    type: collection
    path: src/content/shows
    format: yaml
    filename: "{year}-{month}-{day}-{primary}.yaml"
    view:
      fields: [date, city, venue]
      primary: city
      default:
        sort: date
        order: desc
    fields:
      - { name: date, label: Date, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: city, label: City, type: string, required: true, description: "e.g. Montréal, QC" }
      - { name: venue, label: Venue, type: string }
      - { name: address, label: Address, type: string }
      - { name: doors, label: Doors, type: string, description: "e.g. 7:00 PM" }
      - { name: show_time, label: Show time, type: string }
      - { name: price, label: Price, type: string, description: "e.g. $15 / PWYC" }
      - { name: ages, label: Ages, type: string, description: "e.g. 19+ or All ages" }
      - { name: with, label: Playing with, type: string, list: true, description: "One band per row" }
      - { name: link, label: Tickets or event link, type: string }
      - { name: accessibility, label: Accessibility notes, type: text, description: "Step-free entry, washrooms, seating, masking policy" }
      - { name: notes, label: Other notes, type: text }
      - { name: post_event_link_text, label: After-show button text, type: string, description: "Shown on past shows only, e.g. Watch the set or See photos" }
      - { name: post_event_link, label: After-show link, type: string, description: "Video, photos or recap. The button appears once the show is in Past" }

  - name: releases
    label: Releases
    type: collection
    path: src/content/releases
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, type, date]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: type
        label: Type
        type: select
        required: true
        options: { values: [LP, EP, Single, 2-track] }
      - { name: date, label: Release date, type: date, required: true, options: { format: yyyy-MM-dd } }
      - { name: summary, label: One-line summary, type: string }
      - { name: cover, label: Cover art, type: image, description: "Square, about 1200×1200 px, under 1 MB" }
      - name: bandcamp_kind
        label: Bandcamp embed type
        type: select
        default: none
        description: "none (or blank) shows no player"
        options: { values: [none, album, track], placeholder: none }
      - { name: bandcamp_id, label: Bandcamp embed ID, type: string, description: "The number after album= or track= in Bandcamp's Share/Embed code" }
      - { name: bandcamp_url, label: Bandcamp link, type: string }
      - { name: spotify_url, label: Spotify link, type: string }
      - name: cta
        label: Call to action button
        type: object
        description: "Optional button under the summary. It only appears when both the text and link are filled in."
        fields:
          - name: icon
            label: Icon
            type: select
            options: { values: [none, Play, Headphones, Video, Cart, Ticket, Download, Link] }
          - { name: text, label: Button text, type: string, description: "e.g. Pre-order the LP" }
          - { name: url, label: Button link, type: string }
      - { name: tracks, label: Tracklist, type: string, list: true }
      - { name: tint, label: Cover tint (optional), type: string, description: "Leave blank to use a dark shade of the accent colour from Site Style. Only fill in to give this release its own colour, e.g. #3a1420", pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #3a1420" } }
      - { name: body, label: Credits and notes, type: text }

  - name: merch
    label: Merch
    type: collection
    path: src/content/merch
    format: yaml
    filename: "{primary}.yaml"
    view:
      fields: [name, order]
      primary: name
      default:
        sort: order
        order: asc
    fields:
      - { name: name, label: Item name, type: string, required: true, description: "e.g. Graveyard Smash tee" }
      - { name: photo, label: Photo, type: image, description: "Square works best, about 1200×1200 px, under 1 MB. Without one, the card shows the item name on a coloured tile" }
      - { name: details, label: Details, type: string, list: true, description: "One short line per row, e.g. Black cotton tee / Sizes S–XXL / $25" }
      - { name: link, label: Link, type: string, description: "The page where people can buy or see it" }
      - { name: order, label: Position, type: number, description: "Optional. Lower numbers show first; items without one go last, A to Z" }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Band name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: intro, label: Intro line, type: string }
      - { name: location, label: Location line, type: string }
      - { name: hero_image, label: Hero photo, type: image, description: "Landscape or portrait, about 1600 px wide, under 1 MB" }
      - { name: bio, label: Bio paragraphs, type: text, list: true }
      - name: lineup
        label: Lineup
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: role, label: Instruments, type: string }
      - { name: lineup_note, label: Lineup note, type: string }
      - name: press
        label: Press quotes
        type: object
        list: true
        fields:
          - { name: quote, label: Quote (keep it short), type: string }
          - { name: source, label: Source, type: string }
          - { name: url, label: Link to article, type: string }
      - { name: email, label: Contact email, type: string }
      - { name: epk_url, label: Press kit link, type: string }
      - name: links
        label: Links
        type: object
        fields:
          - { name: bandcamp, label: Bandcamp, type: string }
          - { name: spotify, label: Spotify, type: string }
          - { name: instagram, label: Instagram, type: string }
          - { name: facebook, label: Facebook, type: string }
      - name: menu
        label: Top menu
        type: object
        description: "Labels for the menu at the top of every page. Leave one blank to use the default."
        fields:
          - { name: music, label: Music link text, type: string }
          - { name: shows, label: Shows link text, type: string }
          - { name: merch, label: Merch link text, type: string, description: "Also used as the Merch section's title" }
          - { name: about, label: About link text, type: string }
          - { name: contact, label: Contact link text, type: string }
          - { name: button_text, label: Button text, type: string, description: "e.g. Listen on Bandcamp" }
          - { name: button_link, label: Button link, type: string, description: "Leave blank to use the Bandcamp link above" }
      - name: merch
        label: Merch section
        type: object
        description: "The Merch section and its menu link appear once there's at least one merch item or a button below."
        fields:
          - { name: intro, label: Intro text, type: text, description: "A line or two above the merch cards" }
          - { name: button_text, label: Button text, type: string, description: "Shown below the cards, e.g. View all our merch" }
          - { name: button_link, label: Button link, type: string, description: "e.g. your Bandcamp merch page. The button only appears when both are filled in" }
      - { name: land_acknowledgement, label: Land acknowledgement (footer), type: text }

  - name: style
    label: Site Style
    type: file
    path: src/data/style.json
    format: json
    fields:
      - name: colours
        label: Site colours
        type: object
        description: "Colour codes like #603cba (pick one at https://htmlcolorcodes.com). Leave a colour blank to use its original. Other shades, like divider lines and the footer, follow these automatically."
        fields:
          - { name: accent, label: Accent, type: string, description: "Solid buttons, the Next show banner, selected tabs and releases. Original #603cba (other ideas: #8b1e3f, #2f6b4f, #9a4a12)", pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #603cba" } }
          - { name: accent_text, label: Text on accent, type: string, description: "Text on accent buttons and the banner. Original #ffffff", pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #ffffff" } }
          - { name: background, label: Page background, type: string, description: "Original #0e0c10", pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #0e0c10" } }
          - { name: panel, label: Panel background, type: string, description: "Release panels and photo placeholders. Original #16121a", pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #16121a" } }
          - { name: text, label: Main text, type: string, description: "Links, headings and tab labels. Original #ece4d6", pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #ece4d6" } }
          - { name: text_secondary, label: Secondary text, type: string, description: "Intro, summaries, show details and bio. Original #c8c0cf", pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #c8c0cf" } }
          - { name: text_muted, label: Muted text, type: string, description: "Small labels, dates, credits and track numbers. Original #a79fb0", pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #a79fb0" } }
          - { name: link_hover, label: Link hover, type: string, description: "Links on hover and the keyboard focus outline. Original #c9b8ff", pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #c9b8ff" } }
      - name: use_default_colours
        label: Use the original colours
        type: boolean
        description: "Turn on to put every colour back to the original look. Your colours above are kept, so turning it off brings them back."
      - name: display_font
        label: Heading font
        type: select
        description: "Used for the band name, section titles and release titles. Preview them at fonts.google.com"
        options: { values: ["Pirata One", "UnifrakturMaguntia", "Metal Mania", "New Rocker", "Creepster", "Special Elite", "Bebas Neue", "Anton"] }
      - name: bandcamp_player
        label: Bandcamp player colours
        type: object
        description: "Colours for the Bandcamp players on release pages. Bandcamp only offers these background options, and it sets the plain text colour itself to suit."
        fields:
          - name: background
            label: Background
            type: select
            description: "Blend with page shows the player straight on the dark release panel"
            options: { values: ["Blend with page", "Dark", "Light"] }
          - name: link
            label: Title and link colour
            type: string
            description: "The release title, band name and playing track. Default #b49cff"
            pattern: { regex: "^(#?[0-9a-fA-F]{6})?$", message: "Use a colour code like #b49cff" }

  # Shows EDITING.md in the sidebar so editors can read the guide and find who to contact.
  - name: help
    label: "Help & who to contact"
    type: file
    path: EDITING.md
    format: raw
